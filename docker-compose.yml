# Base Postgres dédiée au Docker : base "invoice_docker", port machine 5433.
# Le backend reçoit PG_* ci-dessous : ces valeurs ÉCRASENT celles du fichier .env
# (ton .env reste pour python app.py → localhost / ta base locale).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoice_docker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata_docker:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoice_docker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      PG_DB: invoice_docker
      PG_USER: postgres
      PG_PASSWORD: postgres
      FLASK_DEBUG: "0"
      # 200 au lieu de 300 : rendu PDF beaucoup plus rapide (timeout navigateur)
      PDF_RENDER_DPI: "200"
      TOKENIZERS_PARALLELISM: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend

  prometheus:
    build:
      context: ./monitoring/prometheus
      dockerfile: Dockerfile
    image: invoice_app-prometheus:local
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - prometheus_tsdb:/prometheus
    depends_on:
      - backend

  grafana:
    build:
      context: ./monitoring/grafana
      dockerfile: Dockerfile
    image: invoice_app-grafana:local
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - db

volumes:
  pgdata_docker:
  backend_uploads:
  grafana_data:
  prometheus_tsdb:
