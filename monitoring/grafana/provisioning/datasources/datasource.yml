apiVersion: 1

# Supprime les anciennes sources créées à la main (URL vide) avant d’appliquer la bonne.
deleteDatasources:
  - name: prometheus
    orgId: 1
  - name: prometheus-1
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  - name: PostgreSQL
    uid: postgres-factupro
    type: postgres
    access: proxy
    url: db:5432
    user: postgres
    database: invoice_docker
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: postgres
